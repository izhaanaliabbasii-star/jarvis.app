name: Build JARVIS APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        run: |
          ZIP=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP found"
            exit 1
          fi

          echo "Found: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract JARVIS
        run: |
          mkdir -p jarvis-project
          unzip -o "${{ steps.zip.outputs.zip }}" -d jarvis-project

      - name: Find Android project
        id: project
        run: |
          ROOT=$(find jarvis-project -name "settings.gradle.kts" -type f | head -n 1)
          ROOT=$(dirname "$ROOT")

          echo "Project root: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build JARVIS APK
        working-directory: ${{ steps.project.outputs.root }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: "${{ steps.project.outputs.root }}/app/build/outputs/apk/debug/*.apk"

