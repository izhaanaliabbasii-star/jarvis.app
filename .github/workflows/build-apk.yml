name: Build JARVIS APK

on:
  push:
    paths:
      - "JARVIS-Android.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Check repository files
        run: |
          echo "Files in repository:"
          ls -la
          echo "ZIP files:"
          find . -maxdepth 2 -type f -iname "*.zip"

      - name: Unzip JARVIS project
        run: |
          unzip -o "JARVIS-Android.zip" -d jarvis-project

      - name: Locate Android project
        id: find_root
        run: |
          ROOT=$(find jarvis-project -name "gradlew" -type f | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "ERROR: Could not find gradlew inside the ZIP."
            find jarvis-project -maxdepth 5 -type f | head -100
            exit 1
          fi

          ROOT=$(dirname "$ROOT")

          echo "Android project root: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle executable
        run: chmod +x "${{ steps.find_root.outputs.root }}/gradlew"

      - name: Build JARVIS APK
        working-directory: ${{ steps.find_root.outputs.root }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: "${{ steps.find_root.outputs.root }}/app/build/outputs/apk/debug/*.apk"
